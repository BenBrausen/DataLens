<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="28" height="28" aria-hidden="true"><rect x="3" y="17" width="6" height="12" rx="2" fill="var(--accent)"/><rect x="13" y="9" width="6" height="20" rx="2" fill="var(--accent)" opacity=".7"/><rect x="23" y="3" width="6" height="26" rx="2" fill="var(--accent)" opacity=".45"/></svg>
    <div><strong>Civic Charts</strong><span>Public data, made plain.</span></div>
  </div>
  <div class="topbar-right">
    <span class="freshness" id="freshness"></span>
    <button class="ghost" id="themeToggle" title="Toggle light/dark interface" aria-label="Toggle interface theme">◐</button>
  </div>
</header>

<main class="workspace">
  <aside class="panel controls" id="controls">
    <nav class="steps" role="tablist">
      <button role="tab" data-step="data" class="active">1 Data</button>
      <button role="tab" data-step="chart">2 Chart</button>
      <button role="tab" data-step="style">3 Style</button>
      <button role="tab" data-step="story">4 Story</button>
      <button role="tab" data-step="export">5 Export</button>
    </nav>
    <div class="step-body" id="stepBody"></div>
  </aside>

  <section class="stage">
    <div class="platforms" id="platforms"></div>
    <div class="canvas-wrap" id="canvasWrap"><canvas id="canvas" aria-label="Chart preview"></canvas></div>
    <div class="transport">
      <button class="play" id="playBtn" aria-label="Play">▶</button>
      <input type="range" id="scrub" min="0" max="1000" value="1000" aria-label="Timeline position">
      <span class="time" id="timeLbl">0.0s</span>
      <label class="chk small"><input type="checkbox" id="safeToggle"> Safe zones</label>
    </div>
  </section>

  <aside class="panel insight" id="insight"></aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="vendor/d3.min.js"></script>
<script src="vendor/topojson-client.min.js"></script>
<script src="js/geo-data.js"></script>

<script src="js/combine.js"></script>
<script src="js/integrity.js"></script>
<script src="js/share.js"></script>
<script src="js/render.js"></script>
<script src="js/export.js"></script>
<script src="js/app.js"></script>
</body>
</html>
