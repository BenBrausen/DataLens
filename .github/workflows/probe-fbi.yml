# Temporary: runs once to learn the FBI API's response format. Removed after.
name: Probe FBI API
on:
  push:
    branches: [main]
    paths: ['scripts/probe-fbi.mjs', '.github/workflows/probe-fbi.yml']
permissions: { contents: read }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/probe-fbi.mjs
        env:
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
