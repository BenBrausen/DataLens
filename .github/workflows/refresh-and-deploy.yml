# Keeps every dataset current and publishes the site + data snapshots to GitHub Pages.
# The JSON under /data/ is the central, versioned copy everyone reads from:
#   https://<owner>.github.io/<repo>/data/catalog.json
name: Refresh data and deploy
on:
  schedule:
    - cron: '17 */6 * * *'   # data, every 6 hours
    - cron: '17 6 * * 1'     # data + portal re-verification, Mondays
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: refresh, cancel-in-progress: false }
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Pull latest data from official sources
        run: node scripts/refresh-data.mjs
        env:
          # Optional free keys raise rate limits / unlock sources. Add as repo secrets.
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          API_DATA_GOV_KEY: ${{ secrets.API_DATA_GOV_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Re-verify state portals (platform, dataset counts, moved domains)
        if: github.event_name != 'schedule' || github.event.schedule == '17 6 * * 1'
        continue-on-error: true
        run: node scripts/build-sources.mjs
      - run: node scripts/build-artifact.mjs
      - name: Commit changed snapshots (gives every dataset a version history)
        run: |
          git config user.name "civiccharts-bot"
          git config user.email "civiccharts-bot@users.noreply.github.com"
          # Save only the files this run changed, on top of the latest main. If another run
          # pushed meanwhile, start again from its commit instead of merging JSON (which
          # conflicts); a source that failed here keeps the other run's newer copy.
          changed=$(git status --porcelain public/data public/sources | awk '{print $2}')
          [ -z "$changed" ] && { echo "No data changes"; exit 0; }
          tmp=$(mktemp -d); for f in $changed; do mkdir -p "$tmp/$(dirname "$f")"; cp "$f" "$tmp/$f"; done
          for attempt in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd "$tmp" && find . -type f) | while read f; do cp "$tmp/$f" "$f"; done
            git add -- $changed
            git diff --cached --quiet && { echo "Already up to date"; exit 0; }
            git commit -q -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin HEAD:main && exit 0
            echo "Push raced another run; retrying ($attempt)"; sleep $((attempt * 5))
          done
          exit 1
      # Publishing is opt-in: enable Pages (Settings > Pages > Source: GitHub Actions),
      # then add a repository variable PAGES_ENABLED = true.
      # Dataset pages (/federal-debt/ etc.), link-preview images, sitemap and RSS feed, built
      # from the real app via its render hook. If this fails, the plain app still deploys.
      - name: Build dataset pages, previews, sitemap and feed
        continue-on-error: true
        run: |
          npx playwright install --with-deps chromium
          node scripts/build-pages.mjs
      - run: '[ -f _site/index.html ] || cp -r public _site'
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - if: vars.PAGES_ENABLED == 'true'
        uses: actions/deploy-pages@v4
