<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=Source+Serif+4:opsz,wght@8..60,700;8..60,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;background:#f7f5f0;font-family:Inter,sans-serif;color:#16181d;overflow:hidden;position:relative}
.wrap{display:flex;height:100%;padding:64px 72px}
.left{flex:1.05;display:flex;flex-direction:column;justify-content:space-between}
.brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:30px;letter-spacing:-.01em}
h1{font-family:"Source Serif 4",serif;font-weight:800;font-size:76px;line-height:1.02;letter-spacing:-.02em;margin-top:-8px}
h1 span{color:#2a78d6}
p{font-size:25px;line-height:1.4;color:#4a505a;max-width:520px}
.url{font-size:22px;font-weight:600;color:#2a78d6}
.right{flex:.95;display:flex;align-items:flex-end;justify-content:center;position:relative}
.chip{position:absolute;top:18px;right:6px;background:#fff;border:2px solid #e3e0d8;border-radius:999px;padding:10px 18px 10px 12px;display:flex;gap:10px;align-items:center;font-weight:600;font-size:19px;box-shadow:0 2px 6px rgba(0,0,0,.06)}
.chip i{width:28px;height:28px;border-radius:50%;background:#1baf7a;display:grid;place-items:center}
.stripe{position:absolute;left:0;top:0;bottom:0;width:12px;background:#2a78d6}
</style></head><body><div class="stripe"></div>
<div class="wrap">
 <div class="left">
  <div class="brand"><svg viewBox="0 0 32 32" width="44" height="44"><rect x="3" y="17" width="6" height="12" rx="2" fill="#2a78d6"/><rect x="13" y="9" width="6" height="20" rx="2" fill="#2a78d6" opacity=".75"/><rect x="23" y="3" width="6" height="26" rx="2" fill="#2a78d6" opacity=".5"/></svg>Civic Charts</div>
  <div><h1>Official public data, <span>made plain.</span></h1></div>
  <p>Honest charts and maps from government sources. Every chart cites its source and is checked against the data.</p>
  <div class="url">civiccharts.com</div>
 </div>
 <div class="right">
  <div class="chip"><i><svg width="16" height="16" viewBox="0 0 16 16"><path d="M3 8.5l3 3 7-7" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></i>Source cited</div>
  <svg width="470" height="440" viewBox="0 0 470 440">
   <g stroke="#e3e0d8" stroke-width="2"><line x1="0" y1="120" x2="470" y2="120"/><line x1="0" y1="220" x2="470" y2="220"/><line x1="0" y1="320" x2="470" y2="320"/></g>
   <!-- capitol: dome + bars rising to the center -->
   <rect x="232" y="44" width="6" height="60" rx="3" fill="#16181d"/><path d="M238 46 h30 l-8 9 l8 9 h-30 z" fill="#eb6834"/>
   <path d="M175 160 A60 60 0 0 1 295 160 Z" fill="#2a78d6"/>
   <rect x="196" y="150" width="78" height="14" rx="4" fill="#1f5fae"/>
   <g fill="#2a78d6">
    <rect x="10"  y="300" width="44" height="120" rx="8" opacity=".35"/>
    <rect x="68"  y="260" width="44" height="160" rx="8" opacity=".5"/>
    <rect x="126" y="215" width="44" height="205" rx="8" opacity=".7"/>
    <rect x="184" y="170" width="102" height="250" rx="8"/>
    <rect x="300" y="215" width="44" height="205" rx="8" opacity=".7"/>
    <rect x="358" y="260" width="44" height="160" rx="8" opacity=".5"/>
    <rect x="416" y="300" width="44" height="120" rx="8" opacity=".35"/>
   </g>
   <g fill="#f7f5f0" opacity=".9"><rect x="204" y="200" width="10" height="200" rx="5"/><rect x="230" y="200" width="10" height="200" rx="5"/><rect x="256" y="200" width="10" height="200" rx="5"/></g>
   <rect x="0" y="420" width="470" height="6" rx="3" fill="#16181d"/>
  </svg>
 </div>
</div></body></html>
